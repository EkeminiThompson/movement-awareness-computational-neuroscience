name: IACKD full-data audit and LOPO analysis

on:
  push:
    branches: ["feat/iackd-novelty-lopo-experiment"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iackd-full-analysis
  cancel-in-progress: true

jobs:
  iackd-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Check available disk
        run: df -h
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download and checksum-verify complete IACKD v1.0.0 from NEMAR manifest
        run: |
          python scripts/download_iackd_manifest.py --dataset-id on006840 --version v1.0.0 --output-dir data/on006840 --max-workers 4
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/on006840/dataset_description.json").read_text())
          print(json.dumps(d, indent=2))
          if "IACKD" not in d.get("Name", ""):
              raise SystemExit("Downloaded dataset name is not IACKD; stop and inspect provenance.")
          PY
      - name: Install analysis dependencies
        run: python -m pip install -r requirements-iackd-analysis.txt
      - name: Audit MATLAB arrays, event matching and extract causal EEG features
        run: |
          python scripts/audit_and_extract_iackd.py --dataset data/on006840 --output-dir reports/iackd
      - name: Run all 15 participant-held-out folds for each kinematic outcome
        run: |
          python scripts/run_lopo_experiment.py --input-csv reports/iackd/audited_eeg_kinematics_features.csv --target movement_duration_ms --output-dir reports/iackd/lopo_duration
          python scripts/run_lopo_experiment.py --input-csv reports/iackd/audited_eeg_kinematics_features.csv --target path_length_mm --output-dir reports/iackd/lopo_path_length
          python scripts/run_lopo_experiment.py --input-csv reports/iackd/audited_eeg_kinematics_features.csv --target peak_speed_mm_s --output-dir reports/iackd/lopo_peak_speed
      - name: Generate paper tables and figures
        run: python scripts/build_iackd_manuscript_results.py --results-dir reports/iackd
      - name: Upload audit, results, figures and manuscript tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iackd-audit-and-results
          path: reports/iackd/
          if-no-files-found: warn
          retention-days: 30
