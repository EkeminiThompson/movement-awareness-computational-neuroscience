name: LOPO experiment tests

on:
  push:
    branches: [main, "feat/iackd-novelty-lopo-experiment"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - name: Install analysis dependencies
        run: python -m pip install -r requirements-iackd-analysis.txt pytest
      - name: Run LOPO experiment tests
        run: python -m pytest -q tests/test_lopo_experiment.py tests/test_iackd_raw_audit.py tests/test_download_iackd_manifest.py
