name: Research protocol checks

on:
  push:
    branches: ["main", "research/**"]
  pull_request:
    branches: ["main"]

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Install test dependencies
        run: python -m pip install "numpy>=1.24" "pytest>=7.0"
      - name: Run test suite
        run: python -m pytest -q
      - name: Verify unittest discovery compatibility
        run: python -m unittest discover -s tests -v
